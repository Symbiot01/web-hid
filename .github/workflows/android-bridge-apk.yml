name: Android bridge APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android_bridge/**"
      - ".github/workflows/android-bridge-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-34
            build-tools;34.0.0
          accept-android-sdk-licenses: true
      - name: Build debug APK
        working-directory: android_bridge
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: lookcam-bridge
          path: android_bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
